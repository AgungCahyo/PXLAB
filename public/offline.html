<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#fffdf7" />
    <title>PXLB — Offline</title>
    <style>
      :root {
        color-scheme: light;
      }
      body {
        margin: 0;
        min-height: 100dvh;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: max(1.5rem, env(safe-area-inset-top)) max(1.5rem, env(safe-area-inset-right))
          max(1.5rem, env(safe-area-inset-bottom)) max(1.5rem, env(safe-area-inset-left));
        font-family: system-ui, sans-serif;
        background: #fffdf7;
        color: #282b35;
      }
      main {
        max-width: 22rem;
        text-align: center;
      }
      .mark {
        display: inline-grid;
        grid-template-columns: 1fr 1fr;
        gap: 4px;
        width: 48px;
        height: 48px;
        margin: 0 auto 1.25rem;
      }
      .mark span {
        display: block;
      }
      h1 {
        font-size: 1.125rem;
        margin: 0 0 0.5rem;
      }
      p {
        margin: 0 0 1.25rem;
        color: #5c5866;
        font-size: 0.9375rem;
        line-height: 1.5;
      }
      button {
        min-height: 2.75rem;
        padding: 0 1.25rem;
        border: 3px solid #936037;
        background: #fff;
        color: #282b35;
        font: inherit;
        font-weight: 600;
        box-shadow: 4px 4px 0 #282b35;
        cursor: pointer;
      }
    </style>
  </head>
  <body>
    <main>
      <div class="mark" aria-hidden="true">
        <span style="background:#59bceb"></span>
        <span style="background:#45a849"></span>
        <span style="background:#ffd447"></span>
        <span style="background:#e94b3c"></span>
      </div>
      <h1>PXLB is offline</h1>
      <p>
        You&apos;re offline right now. Reconnect to explore, create, and sync your work.
        <br />
        <span lang="id">Kamu sedang offline. Hubungkan ulang untuk lanjut.</span>
      </p>
      <button type="button" onclick="location.reload()">Try again</button>
    </main>
  </body>
</html>
