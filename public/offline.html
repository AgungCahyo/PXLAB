<!DOCTYPE html>
<html lang="id">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <!-- Matches app/manifest.ts theme_color (PWA install surface); not a page token. -->
    <meta name="theme-color" content="#ffffff" />
    <title>PXLB — Offline</title>
    <style>
      :root {
        color-scheme: light;
        /* Mirrors the shipped tokens in app/globals.css — live tokens win (U3). */
        --bg: #ffffff;
        --fg: #111113;
        --muted: #52525b;
        --card: #ffffff;
        --sky: #ff4f00;
        --grass: #15803d;
        --coin: #d97706;
        --brick: #e4002b;
        --earth: #71717a;
      }
      body {
        margin: 0;
        min-height: 100dvh;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: max(1.5rem, env(safe-area-inset-top)) max(1.5rem, env(safe-area-inset-right))
          max(1.5rem, env(safe-area-inset-bottom)) max(1.5rem, env(safe-area-inset-left));
        font-family: system-ui, sans-serif;
        background: var(--bg);
        color: var(--fg);
      }
      main {
        max-width: 22rem;
        text-align: center;
      }
      .mark {
        display: inline-grid;
        grid-template-columns: 1fr 1fr;
        gap: 4px;
        width: 48px;
        height: 48px;
        margin: 0 auto 1.25rem;
      }
      .mark span {
        display: block;
      }
      h1 {
        font-size: 1.125rem;
        margin: 0 0 0.5rem;
      }
      p {
        margin: 0 0 1.25rem;
        color: var(--muted);
        font-size: 0.9375rem;
        line-height: 1.5;
      }
      button {
        min-height: 2.75rem;
        padding: 0 1.25rem;
        border: 3px solid var(--earth);
        background: var(--card);
        color: var(--fg);
        font: inherit;
        font-weight: 600;
        box-shadow: 4px 4px 0 var(--fg);
        cursor: pointer;
      }
    </style>
  </head>
  <body>
    <main>
      <div class="mark" aria-hidden="true">
        <span style="background: var(--sky)"></span>
        <span style="background: var(--grass)"></span>
        <span style="background: var(--coin)"></span>
        <span style="background: var(--brick)"></span>
      </div>
      <!-- Static fallback is Indonesian (DEFAULT_LANG); the script below upgrades to English. -->
      <h1 id="offline-title">PXLB sedang offline</h1>
      <p id="offline-body">
        Kamu sedang offline. Hubungkan ulang untuk menjelajah, membuat, dan menyinkronkan karyamu.
      </p>
      <button type="button" id="offline-retry" onclick="location.reload()">Coba lagi</button>
    </main>
    <script>
      ;(function () {
        var english = /^en\b/.test((navigator.language || "").toLowerCase())
        if (!english) return
        document.documentElement.lang = "en"
        document.getElementById("offline-title").textContent = "PXLB is offline"
        document.getElementById("offline-body").textContent =
          "You're offline right now. Reconnect to explore, create, and sync your work."
        document.getElementById("offline-retry").textContent = "Try again"
      })()
    </script>
  </body>
</html>
